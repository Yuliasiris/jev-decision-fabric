name: Public SDK second caller use

on:
  push:
    branches: [p0/second-host-use-20261013]
    paths:
      - .github/workflows/second-host-use.yml
      - ci/second-host-use.mjs

permissions:
  contents: read

jobs:
  public-sample-use:
    if: github.repository == 'Yuliasiris/jev-decision-fabric' && github.ref == 'refs/heads/p0/second-host-use-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read the caller harness from this exact push
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
          fetch-depth: 1
      - name: Read the already adopted public SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8564d529fca55f5be4683ec53c05348ac71e5729
          path: public-source
          persist-credentials: false
          fetch-depth: 1
      - name: Use a fixed supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          check-latest: false
      - name: Build and pack the pinned public source
        working-directory: public-source
        env:
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/jev-second-caller-user.npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/jev-second-caller-global.npmrc
          NPM_CONFIG_CACHE: ${{ runner.temp }}/jev-second-caller-source-cache
        run: |
          node -e 'const fs=require("node:fs");for(const key of ["NPM_CONFIG_USERCONFIG","NPM_CONFIG_GLOBALCONFIG"])fs.writeFileSync(process.env[key],"",{flag:"wx"})'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:sdk
          mkdir ../distribution
          npm pack --ignore-scripts --json --pack-destination ../distribution > ../pack.json
      - name: Receive real public-sample work through the installed consumer
        run: node caller/ci/second-host-use.mjs public-source pack.json distribution second-caller-evidence
      - name: Return the original result, raw operations and saved archive
        id: archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jev-second-caller-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            second-caller-evidence/*.json
            second-caller-evidence/*.txt
            second-caller-evidence/*.csv
            second-caller-evidence/*.tgz
            second-caller-evidence/owned-state/
            second-caller-evidence/phase-paused-state/
            second-caller-evidence/phase-completed-state/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Show the platform artifact receipt
        if: always() && steps.archive.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.archive.outputs.artifact-digest }}
        run: |
          node -e 'console.log(JSON.stringify({artifact_id:process.env.ARTIFACT_ID,artifact_url:process.env.ARTIFACT_URL,artifact_digest:process.env.ARTIFACT_DIGEST,scope:"GitHub platform receipt; Root independently reads it before adoption"}))'
